<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kissa ja ankka</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 800; src: url("../../fonts/inter-latin-800-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 1080px; height: 1920px; }
  #gl, #over { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #gl canvas { display: block; }
  #subs { font-family: "Inter", "DejaVu Sans", sans-serif; font-weight: 800; }
</style>
</head>
<body>
<div id="gl"></div>
<!-- 3D-kuvan päälle: salama, sävy, vinjetti, filmirae ja tekstitys -->
<svg id="over" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vignette" cx=".5" cy=".48" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence id="grainT" type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="1"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0"/>
  <rect width="1080" height="1920" fill="#FFB060" opacity=".04" style="mix-blend-mode:soft-light"/>
  <rect width="1080" height="1920" fill="url(#vignette)"/>
  <rect width="1080" height="1920" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
  <text id="subs" x="540" y="470" text-anchor="middle" font-size="78" fill="#fff" stroke="#111" stroke-width="14" paint-order="stroke" stroke-linejoin="round"></text>
</svg>

<script src="ajat.js"></script>
<script>window.PUHE = window.PUHE || []; window.READY = false;</script>
<script src="puhe.js"></script>
<script>
// Tekstitys: kertojan sanat enintään kolme kerrallaan, puhuttava sana keltaisena
window.overlay = function (t, flash) {
  document.getElementById('flash').setAttribute('opacity', flash || 0);
  document.getElementById('grainT').setAttribute('seed', Math.round(t * 24) % 97 + 1);
  const el = document.getElementById('subs');
  el.textContent = '';
  const line = window.PUHE.find(l => t >= l.start && t < l.start + l.dur + .2);
  if (!line || !line.words || !line.words.length) return;
  const w = line.words;
  let i = w.findIndex((x, k) => t < (k + 1 < w.length ? w[k + 1].t : line.start + line.dur + .2));
  if (i < 0) i = w.length - 1;
  const c0 = Math.floor(i / 3) * 3;
  for (let k = c0; k < Math.min(c0 + 3, w.length); k++) {
    const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    ts.textContent = (k > c0 ? ' ' : '') + w[k].w.toUpperCase();
    ts.setAttribute('fill', k === i ? '#FFD84A' : '#FFFFFF');
    el.appendChild(ts);
  }
};
window.DURATION = window.AJAT.end;
</script>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/",
  "three-mesh-bvh": "../node_modules/three-mesh-bvh/src/index.js",
  "three-bvh-csg": "../node_modules/three-bvh-csg/src/index.js"
} }
</script>
<script type="module" src="kohtaus.js"></script>
</body>
</html>
