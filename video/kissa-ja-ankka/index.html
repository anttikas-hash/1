<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Kissa ja ankka</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 1080px; height: 1920px; }
  .pop { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; font-weight: 900; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC8F2"/><stop offset="1" stop-color="#CDEBFA"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9E6B"/><stop offset="1" stop-color="#FFD59E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1D6"/><stop offset="1" stop-color="#FBE2B8"/>
    </linearGradient>
    <polygon id="star" points="0,-36 10,-11 36,-11 15,5 23,32 0,16 -23,32 -15,5 -36,-11 -10,-11"/>
  </defs>

  <!-- Kohtaukset 1–2: puisto -->
  <g id="park">
    <rect width="1080" height="1920" fill="url(#sky)"/>
    <circle cx="860" cy="330" r="110" fill="#FFE066"/>
    <g id="clouds" fill="#fff">
      <g id="cloud1"><ellipse cx="0" cy="0" rx="120" ry="45"/><ellipse cx="-60" cy="-25" rx="70" ry="50"/><ellipse cx="50" cy="-35" rx="75" ry="55"/></g>
      <g id="cloud2"><ellipse cx="0" cy="0" rx="100" ry="38"/><ellipse cx="-45" cy="-22" rx="55" ry="42"/><ellipse cx="40" cy="-28" rx="60" ry="45"/></g>
    </g>
    <ellipse cx="200" cy="1330" rx="520" ry="260" fill="#8FD17A"/>
    <ellipse cx="950" cy="1360" rx="560" ry="280" fill="#7CC468"/>
    <g id="trees">
      <g transform="translate(130,1240)"><rect x="-22" y="-40" width="44" height="160" fill="#8A5A34"/><circle cy="-120" r="120" fill="#4FA85A"/><circle cx="-70" cy="-60" r="80" fill="#5BB866"/></g>
      <g transform="translate(960,1260)"><rect x="-20" y="-30" width="40" height="150" fill="#8A5A34"/><circle cy="-100" r="105" fill="#4FA85A"/><circle cx="60" cy="-50" r="70" fill="#5BB866"/></g>
    </g>
    <rect y="1380" width="1080" height="540" fill="#6DBE5A"/>
    <path d="M0,1470 C300,1440 700,1500 1080,1460 L1080,1620 C700,1660 300,1600 0,1640 Z" fill="#E8D3A2"/>
    <g fill="#5AA84A">
      <path d="M80,1760 l12,-40 l12,40 z M720,1800 l12,-45 l12,45 z M980,1720 l10,-35 l10,35 z M400,1840 l12,-42 l12,42 z"/>
    </g>
  </g>

  <!-- Kohtaus 3: tie -->
  <g id="road" display="none">
    <rect width="1080" height="1920" fill="url(#sky2)"/>
    <circle cx="540" cy="760" r="170" fill="#FFF3B0" opacity="0.9"/>
    <g id="hills"></g>
    <g id="roadTrees"></g>
    <rect y="1330" width="1080" height="590" fill="#555A66"/>
    <rect y="1320" width="1080" height="18" fill="#8A8F99"/>
    <g id="stripes" fill="#FFE066"></g>
    <rect y="1760" width="1080" height="160" fill="#6DBE5A"/>
    <g id="speed" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.7"></g>
  </g>

  <!-- Kohtaus 4: keittiö -->
  <g id="kitchen" display="none">
    <rect width="1080" height="1920" fill="url(#wall)"/>
    <g fill="#F5D59A" opacity="0.7">
      <rect x="0" y="560" width="1080" height="8"/><rect x="0" y="700" width="1080" height="8"/><rect x="0" y="840" width="1080" height="8"/>
    </g>
    <rect x="620" y="330" width="330" height="260" rx="20" fill="#9ED8F5" stroke="#fff" stroke-width="22"/>
    <rect x="775" y="330" width="20" height="260" fill="#fff"/>
    <rect x="0" y="1380" width="1080" height="540" fill="#B77B4B"/>
    <rect x="0" y="1360" width="1080" height="40" fill="#8C5A33"/>
    <g fill="#9A6538"><rect x="60" y="1470" width="300" height="360" rx="14"/><rect x="400" y="1470" width="300" height="360" rx="14"/><rect x="740" y="1470" width="300" height="360" rx="14"/></g>
    <g fill="#E9C9A0"><circle cx="330" cy="1650" r="12"/><circle cx="430" cy="1650" r="12"/><circle cx="1010" cy="1650" r="12"/></g>
    <rect x="360" y="1330" width="380" height="40" rx="10" fill="#3A3F4A"/>
    <ellipse cx="550" cy="1330" rx="110" ry="14" fill="#E4572E" id="flame" opacity="0.8"/>
    <g id="steam" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"></g>
  </g>

  <g id="actors"></g>

  <g id="fx">
    <g id="bonk" display="none">
      <polygon points="0,-150 40,-60 140,-100 80,-20 170,40 60,50 70,160 0,80 -70,160 -60,50 -170,40 -80,-20 -140,-100 -40,-60" fill="#FFE066" stroke="#E4572E" stroke-width="10"/>
      <text class="pop" text-anchor="middle" y="30" font-size="88" fill="#E4572E">BONK!</text>
    </g>
  </g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const set = (id, attrs) => { const el = $(id); for (const k in attrs) el.setAttribute(k, attrs[k]); };
const tf = (id, v) => $(id).setAttribute('transform', v);
const show = (id, on) => $(id).setAttribute('display', on ? 'inline' : 'none');

// ---- Hahmot ----------------------------------------------------------
// Origo on jalkojen keskellä maan tasossa, hahmo katsoo oikealle.
function catSVG(p) {
  const leg = (n, x, c) => `<g id="${p}-l${n}" transform="translate(${x},-115)"><rect x="-19" y="0" width="38" height="115" rx="19" fill="${c}"/></g>`;
  const star = i => `<use id="${p}-s${i}" href="#star" fill="#FFD23F" stroke="#E4A000" stroke-width="4"/>`;
  return `<g id="${p}">
    <path id="${p}-tail" d="M-140,-180 C-250,-200 -260,-300 -210,-370" stroke="#E8893A" stroke-width="36" fill="none" stroke-linecap="round"/>
    ${leg(1, -95, '#C96F28')}${leg(2, 70, '#C96F28')}
    <ellipse cy="-170" rx="160" ry="95" fill="#F29B4B"/>
    <path d="M-60,-250 q15,40 0,80 M-10,-262 q15,45 0,90 M40,-258 q15,40 0,80" stroke="#E07E2E" stroke-width="16" fill="none" stroke-linecap="round"/>
    ${leg(3, -60, '#E8893A')}${leg(4, 105, '#E8893A')}
    <g id="${p}-arm" display="none"><rect x="-18" y="0" width="36" height="120" rx="18" fill="#E8893A"/></g>
    <g id="${p}-head" transform="translate(130,-290)">
      <polygon points="-85,-40 -70,-140 -10,-80" fill="#F29B4B"/><polygon points="-70,-60 -64,-115 -30,-80" fill="#FFB5A7"/>
      <polygon points="85,-40 70,-140 10,-80" fill="#F29B4B"/><polygon points="70,-60 64,-115 30,-80" fill="#FFB5A7"/>
      <circle r="100" fill="#F29B4B"/>
      <ellipse cx="0" cy="40" rx="55" ry="38" fill="#FFE3C4"/>
      <g id="${p}-eyes"><ellipse cx="-38" cy="-15" rx="15" ry="20" fill="#2B2B35"/><ellipse cx="38" cy="-15" rx="15" ry="20" fill="#2B2B35"/><circle cx="-33" cy="-22" r="6" fill="#fff"/><circle cx="43" cy="-22" r="6" fill="#fff"/></g>
      <g id="${p}-xeyes" display="none" stroke="#2B2B35" stroke-width="10" stroke-linecap="round"><path d="M-52,-30 l28,28 M-24,-30 l-28,28 M24,-30 l28,28 M52,-30 l-28,28"/></g>
      <polygon points="-12,18 12,18 0,32" fill="#E86A7A"/>
      <path d="M0,32 q-14,20 -30,10 M0,32 q14,20 30,10" stroke="#2B2B35" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-50,30 l-80,-10 M-50,45 l-80,10 M50,30 l80,-10 M50,45 l80,10" stroke="#2B2B35" stroke-width="4" stroke-linecap="round"/>
      <g id="${p}-shades" display="none"><rect x="-75" y="-42" width="66" height="44" rx="14" fill="#15151C"/><rect x="9" y="-42" width="66" height="44" rx="14" fill="#15151C"/><rect x="-12" y="-30" width="24" height="9" fill="#15151C"/><rect x="-65" y="-36" width="22" height="8" rx="4" fill="#fff" opacity="0.5"/><rect x="19" y="-36" width="22" height="8" rx="4" fill="#fff" opacity="0.5"/></g>
      <g id="${p}-hat" display="none" transform="translate(0,-88)"><rect x="-70" y="-30" width="140" height="44" rx="8" fill="#fff" stroke="#DDD" stroke-width="4"/><circle cx="-50" cy="-60" r="45" fill="#fff"/><circle cx="50" cy="-60" r="45" fill="#fff"/><circle cx="0" cy="-85" r="55" fill="#fff"/></g>
      <g id="${p}-stars" display="none">${[0,1,2,3,4].map(star).join('')}</g>
    </g>
  </g>`;
}

function duckSVG(p) {
  const leg = (n, x) => `<g id="${p}-l${n}" transform="translate(${x},-70)"><rect x="-8" y="0" width="16" height="66" fill="#F08A24"/><ellipse cx="18" cy="66" rx="30" ry="12" fill="#F08A24"/></g>`;
  return `<g id="${p}">
    ${leg(1, -25)}${leg(2, 25)}
    <path d="M-120,-150 l-50,-40 l20,70 z" fill="#F7C531"/>
    <ellipse cy="-140" rx="125" ry="85" fill="#FFD84A"/>
    <g id="${p}-stick" display="none" transform="translate(10,-150)"><rect x="-14" y="-280" width="28" height="300" rx="14" fill="#8A5A34"/><circle cx="0" cy="-280" r="24" fill="#8A5A34"/></g>
    <ellipse id="${p}-wing" cx="-10" cy="-140" rx="70" ry="45" fill="#F7C531"/>
    <g id="${p}-head" transform="translate(80,-260)">
      <circle r="72" fill="#FFD84A"/>
      <path d="M50,0 q70,-8 90,15 q-40,30 -90,15 z" fill="#F08A24"/>
      <circle cx="25" cy="-18" r="13" fill="#2B2B35"/><circle cx="29" cy="-23" r="5" fill="#fff"/>
      <g id="${p}-shades" display="none"><rect x="-10" y="-38" width="62" height="36" rx="12" fill="#15151C"/><rect x="-60" y="-28" width="52" height="8" fill="#15151C"/><rect x="0" y="-33" width="20" height="7" rx="3" fill="#fff" opacity="0.5"/></g>
      <g id="${p}-hat" display="none" transform="translate(-5,-62)"><rect x="-50" y="-24" width="100" height="36" rx="8" fill="#fff" stroke="#DDD" stroke-width="4"/><circle cx="-35" cy="-48" r="32" fill="#fff"/><circle cx="35" cy="-48" r="32" fill="#fff"/><circle cx="0" cy="-66" r="40" fill="#fff"/></g>
    </g>
  </g>`;
}

function mopedSVG() {
  const wheel = (id, x) => `<g transform="translate(${x},0)"><circle r="85" fill="#22242B"/><circle r="45" fill="#C9CED8"/><g id="${id}" stroke="#7A808C" stroke-width="10"><path d="M-45,0 H45 M0,-45 V45 M-32,-32 L32,32 M-32,32 L32,-32"/></g><circle r="14" fill="#555"/></g>`;
  return `<g id="moped">
    ${wheel('w1', -250)}${wheel('w2', 250)}
    <path d="M-330,-90 Q-330,-190 -200,-190 L60,-190 Q140,-190 170,-120 L240,-20 L-300,-20 Q-330,-20 -330,-90 Z" fill="#E4572E"/>
    <path d="M150,-150 L240,-380" stroke="#9AA0AA" stroke-width="24" stroke-linecap="round"/>
    <path d="M200,-390 L300,-370" stroke="#22242B" stroke-width="26" stroke-linecap="round"/>
    <path d="M210,-110 Q300,-110 320,-30 L180,-30 Z" fill="#E4572E"/>
    <circle cx="280" cy="-260" r="34" fill="#FFF3B0" stroke="#9AA0AA" stroke-width="10"/>
    <rect x="-260" y="-230" width="330" height="50" rx="25" fill="#2B2B35"/>
    <path d="M-340,-40 L-400,-40" stroke="#9AA0AA" stroke-width="18" stroke-linecap="round"/>
  </g>`;
}

function panSVG() {
  return `<g id="pan">
    <rect x="-280" y="-14" width="200" height="28" rx="14" fill="#2B2B35"/>
    <path d="M-100,-20 L100,-20 Q95,40 0,40 Q-95,40 -100,-20 Z" fill="#3A3F4A"/>
    <ellipse cx="0" cy="-20" rx="100" ry="22" fill="#23262E"/>
    <g id="cake"><ellipse rx="75" ry="16" fill="#F2C06B"/><ellipse rx="55" ry="10" fill="#E8A94C"/></g>
  </g>`;
}

function build() {
  const a = $('actors');
  a.innerHTML = `
    <g id="walk">${duckSVG('d1')}${catSVG('c1')}</g>
    <g id="ride">${duckSVG('d3')}${catSVG('c3')}${mopedSVG()}</g>
    <g id="cook">${duckSVG('d4')}${catSVG('c4')}${panSVG()}</g>`;
  // Tien toistuvat elementit (siirretään render()-funktiossa)
  let h = '';
  for (let i = 0; i < 4; i++) h += `<ellipse id="hill${i}" cy="1320" rx="420" ry="260" fill="${i % 2 ? '#C9785A' : '#D98B63'}"/>`;
  $('hills').innerHTML = h;
  let tr = '';
  for (let i = 0; i < 5; i++) tr += `<g id="rt${i}"><rect x="-18" y="-20" width="36" height="120" fill="#6B4A2E"/><circle cy="-90" r="90" fill="#3F8E4E"/></g>`;
  $('roadTrees').innerHTML = tr;
  let st = '';
  for (let i = 0; i < 6; i++) st += `<rect id="st${i}" y="1530" width="150" height="26" rx="13"/>`;
  $('stripes').innerHTML = st;
  let sp = '';
  for (let i = 0; i < 7; i++) sp += `<path id="sp${i}"/>`;
  $('speed').innerHTML = sp;
  let sm = '';
  for (let i = 0; i < 3; i++) sm += `<path id="sm${i}"/>`;
  $('steam').innerHTML = sm;
}

// ---- Apufunktiot hahmoille ------------------------------------------
function walkLegs(p, t, speed, amp) {
  const s = Math.sin(t * speed * Math.PI * 2) * amp;
  for (const [n, sign] of [[1, 1], [2, -1], [3, -1], [4, 1]]) {
    const el = $(`${p}-l${n}`);
    if (!el) continue;
    const base = el.getAttribute('transform').replace(/ rotate\([^)]*\)/, '');
    el.setAttribute('transform', `${base} rotate(${s * sign})`);
  }
}
function tailWag(p, t) {
  const w = Math.sin(t * 5) * 30;
  set(`${p}-tail`, { d: `M-140,-180 C-250,-200 ${-260 + w},-300 ${-210 + w * 1.4},-370` });
}
function resetCat(p) {
  show(`${p}-eyes`, true); show(`${p}-xeyes`, false); show(`${p}-stars`, false);
}

// ---- Kohtaukset -------------------------------------------------------
function sceneWalk(t) { // 0–3 s
  const x = lerp(170, 470, t / 3);
  const bob = Math.abs(Math.sin(t * Math.PI * 4)) * 14;
  tf('c1', `translate(${x},${1560 - bob}) scale(1.15)`);
  tf('d1', `translate(${x + 420},${1540 - Math.abs(Math.sin(t * Math.PI * 4 + 1)) * 12}) scale(1.05)`);
  resetCat('c1');
  show('d1-stick', false);
  walkLegs('c1', t, 2, 28); walkLegs('d1', t + .2, 2, 30); tailWag('c1', t);
  tf('d1-head', `translate(80,${-260 + Math.sin(t * 12) * 5})`);
  tf('c1-head', 'translate(130,-290)');
}

function sceneBonk(t) { // 3–5,5 s
  const u = t - 3;
  // Ankka kääntyy, nostaa kepin ja lyö kissaa päähän.
  const turn = seg(u, 0, .25);
  const sx = lerp(1, -1, easeInOut(turn));
  tf('d1', `translate(890,1540) scale(${1.05 * sx},1.05)`);
  show('d1-stick', u > .2);
  const raise = easeOut(seg(u, .25, .7)), hit = seg(u, .7, .82);
  const ang = hit > 0 ? lerp(-150, 25, easeInOut(hit)) : lerp(0, -150, raise);
  tf('d1-stick', `translate(10,-150) rotate(${ang})`);
  walkLegs('d1', 0, 0, 0);

  const impact = u >= .82;
  const k = impact ? seg(u, .82, 1.0) : 0;
  const squash = impact ? 1 - 0.18 * Math.sin(k * Math.PI) * (1 - seg(u, 1.0, 1.3)) : 1;
  const wobble = impact ? Math.sin(u * 14) * 6 * Math.max(0, 1 - seg(u, 1.2, 2.5)) : 0;
  tf('c1', `translate(470,1560) scale(${1.15 / Math.sqrt(squash)},${1.15 * squash}) rotate(${wobble})`);
  walkLegs('c1', 0, 0, 0);
  tailWag('c1', impact ? 0 : u);
  show('c1-eyes', !impact); show('c1-xeyes', impact);
  show('c1-stars', impact);
  for (let i = 0; i < 5; i++) {
    const a = u * 4 + i * Math.PI * 2 / 5;
    const r = seg(u, .82, 1.1);
    tf(`c1-s${i}`, `translate(${Math.cos(a) * 130 * r},${-150 + Math.sin(a) * 38 * r}) rotate(${u * 200}) scale(${.6 + .25 * Math.sin(a)})`);
  }
  const b = seg(u, .82, 1.0), bOut = seg(u, 1.6, 1.9);
  show('bonk', u > .82 && u < 1.9);
  tf('bonk', `translate(620,1010) scale(${easeOut(b) * 1.2 * (1 - bOut)}) rotate(${-8 + Math.sin(u * 20) * 3})`);
}

function sceneRide(t) { // 5,5–8,5 s
  const u = t - 5.5;
  const speed = 900; // px/s
  const off = u * speed;
  for (let i = 0; i < 4; i++) set(`hill${i}`, { cx: ((i * 520 - off * .2) % 2080 + 2080) % 2080 - 400 });
  for (let i = 0; i < 5; i++) tf(`rt${i}`, `translate(${((i * 330 - off * .6) % 1650 + 1650) % 1650 - 250},1240)`);
  for (let i = 0; i < 6; i++) set(`st${i}`, { x: ((i * 280 - off) % 1680 + 1680) % 1680 - 300 });
  for (let i = 0; i < 7; i++) {
    const y = 780 + i * 90 + (i % 2) * 30;
    const x = ((i * 410 - off * 1.6) % 1400 + 1400) % 1400 - 160;
    set(`sp${i}`, { d: `M${x},${y} h${120 + (i % 3) * 60}` });
  }
  // Mopo tulee sisään vasemmalta ja hyppää kuopassa
  const enter = easeOut(seg(u, 0, .6));
  const mx = lerp(-300, 560, enter);
  const bump = Math.sin(u * 22) * 6 + (u > 1.6 && u < 2.1 ? -Math.sin(seg(u, 1.6, 2.1) * Math.PI) * 60 : 0);
  const tilt = u > 1.6 && u < 2.1 ? -Math.sin(seg(u, 1.6, 2.1) * Math.PI) * 6 : Math.sin(u * 3) * 1.2;
  tf('ride', `translate(${mx},${1500 + bump}) rotate(${tilt}) translate(-560,-1500)`);
  tf('moped', 'translate(560,1500) scale(1.05)');
  tf('w1', `rotate(${u * 900})`); tf('w2', `rotate(${u * 900})`);
  // Kissa kuskina, ankka takana. Jalat piiloon mopon taakse.
  tf('c3', 'translate(640,1350) scale(0.95)');
  tf('d3', `translate(360,1330) scale(0.9)`);
  resetCat('c3');
  show('c3-shades', true); show('d3-shades', true);
  tailWag('c3', u * 3);
  tf('c3-head', `translate(130,${-290 + Math.sin(u * 22) * 4})`);
  tf('d3-head', `translate(80,${-260 + Math.sin(u * 22 + 1) * 5}) rotate(${Math.sin(u * 6) * 6})`);
  walkLegs('c3', 0, 0, 0); walkLegs('d3', 0, 0, 0);
}

function sceneCook(t) { // 8,5–12 s
  const u = t - 8.5;
  tf('c4', 'translate(420,1560) scale(1.1)');
  resetCat('c4');
  show('c4-hat', true); show('d4-hat', true);
  show('c4-arm', true);
  tailWag('c4', u);
  walkLegs('c4', 0, 0, 0);
  // Pannukakku lentää kahdesti; pannu nytkähtää ennen jokaista heittoa.
  const flips = [[.8, 1.8], [2.2, 3.1]];
  let cy = -20, rot = 0, jolt = 0;
  for (const [a, b] of flips) {
    const k = seg(u, a, b);
    if (k > 0 && k < 1) { cy = -20 - Math.sin(k * Math.PI) * 420; rot = k * 360; }
    const j = seg(u, a - .15, a);
    if (j > 0 && j < 1) jolt = Math.sin(j * Math.PI) * 25;
  }
  const px = 800, py = 1300 - jolt;
  tf('pan', `translate(${px},${py}) rotate(${-jolt * .3})`);
  tf('cake', `translate(0,${cy}) scale(1,${Math.cos(rot * Math.PI / 180)})`);
  tf('c4-arm', `translate(110,-190) rotate(${-120 - jolt * .3})`);
  tf('c4-head', `translate(130,${-290 + Math.sin(u * 4) * 4}) rotate(${cy < -60 ? -8 : 0})`);
  // Ankka seuraa sivusta ja hyppii ilosta onnistuneen käännön jälkeen.
  const cheer = (u > 1.8 && u < 2.2) || u > 3.1 ? Math.abs(Math.sin(u * 14)) * 50 : 0;
  tf('d4', `translate(170,${1560 - cheer}) scale(0.95)`);
  walkLegs('d4', 0, 0, 0);
  set('flame', { rx: 110 + Math.sin(u * 30) * 10, opacity: .75 + Math.sin(u * 17) * .15 });
  for (let i = 0; i < 3; i++) {
    const ph = (u * .8 + i / 3) % 1;
    const x = 750 + i * 50, y = 1240 - ph * 260;
    set(`sm${i}`, { d: `M${x},${y} q25,-40 0,-80 q-25,-40 0,-80`, opacity: Math.sin(ph * Math.PI) });
  }
}

window.render = function (t) {
  const s = t < 3 ? 0 : t < 5.5 ? 1 : t < 8.5 ? 2 : 3;
  show('park', s <= 1); show('road', s === 2); show('kitchen', s === 3);
  show('walk', s <= 1); show('ride', s === 2); show('cook', s === 3);
  if (s !== 1) show('bonk', false);
  tf('cloud1', `translate(${200 + t * 25},330)`);
  tf('cloud2', `translate(${650 + t * 15},520)`);
  [sceneWalk, sceneBonk, sceneRide, sceneCook][s](t);
};
window.DURATION = 12;

build();
window.render(0);
</script>
