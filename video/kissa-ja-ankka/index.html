<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Kissa ja ankka</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 1080px; height: 1920px; }
  .pop { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; font-weight: 900; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DB6EE"/><stop offset="1" stop-color="#CDEBFA"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0F0"/><stop offset="1" stop-color="#E3F4FB"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E4DC"/><stop offset="1" stop-color="#D8D0C4"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#EE8B2E"/>
    </radialGradient>
    <polygon id="star" points="0,-36 10,-11 36,-11 15,5 23,32 0,16 -23,32 -15,5 -36,-11 -10,-11"/>
    <path id="feather" d="M0,-40 C22,-20 22,20 0,40 C-22,20 -22,-20 0,-40 Z M0,-40 L0,55"/>
  </defs>

  <!-- Kohtaukset 1–2: niitty -->
  <g id="park">
    <rect width="1080" height="1920" fill="url(#sky)"/>
    <g id="clouds" fill="#fff">
      <g id="cloud1"><ellipse cx="0" cy="0" rx="150" ry="55"/><ellipse cx="-70" cy="-30" rx="85" ry="60"/><ellipse cx="60" cy="-45" rx="95" ry="70"/></g>
      <g id="cloud2"><ellipse cx="0" cy="0" rx="110" ry="40"/><ellipse cx="-50" cy="-24" rx="60" ry="45"/><ellipse cx="45" cy="-30" rx="65" ry="50"/></g>
      <g id="cloud3"><ellipse cx="0" cy="0" rx="130" ry="48"/><ellipse cx="-55" cy="-28" rx="70" ry="52"/><ellipse cx="50" cy="-38" rx="80" ry="58"/></g>
    </g>
    <ellipse cx="180" cy="1420" rx="560" ry="200" fill="#9BD583"/>
    <ellipse cx="960" cy="1440" rx="600" ry="220" fill="#86C96F"/>
    <rect y="1460" width="1080" height="460" fill="#74C05E"/>
    <g fill="#5FA94B">
      <path d="M60,1560 l10,-38 l10,38 z M300,1880 l12,-45 l12,45 z M760,1860 l12,-42 l12,42 z M990,1600 l10,-35 l10,35 z M520,1540 l9,-30 l9,30 z"/>
    </g>
    <g fill="#fff"><circle cx="130" cy="1700" r="10"/><circle cx="880" cy="1760" r="10"/><circle cx="600" cy="1840" r="9"/></g>
    <g fill="#FFD23F"><circle cx="130" cy="1700" r="4"/><circle cx="880" cy="1760" r="4"/><circle cx="600" cy="1840" r="4"/></g>
  </g>

  <!-- Kohtaus 3: tie -->
  <g id="road" display="none">
    <rect width="1080" height="1920" fill="url(#sky2)"/>
    <g id="bushes"></g>
    <rect y="1330" width="1080" height="590" fill="#7E838E"/>
    <rect y="1320" width="1080" height="20" fill="#B8BCC4"/>
    <g id="stripes" fill="#F4F4F4"></g>
    <rect y="1780" width="1080" height="140" fill="#74C05E"/>
    <g id="speed" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.75"></g>
  </g>

  <!-- Kohtaus 4: keittiö -->
  <g id="kitchen" display="none">
    <rect width="1080" height="1920" fill="url(#wall)"/>
    <rect x="80" y="260" width="420" height="330" rx="16" fill="#BFE3F5" stroke="#fff" stroke-width="24"/>
    <rect x="278" y="260" width="24" height="330" fill="#fff"/>
    <rect x="620" y="300" width="400" height="30" rx="6" fill="#8C6A4A"/>
    <g fill="#B7B7BF"><rect x="660" y="200" width="70" height="100" rx="10"/><rect x="760" y="170" width="60" height="130" rx="10"/></g>
    <g stroke="#6B6B73" stroke-width="10" fill="none"><path d="M880,330 v60 M940,330 v80 M1000,330 v50"/></g>
    <g fill="#C9A06B"><circle cx="880" cy="410" r="28"/><rect x="920" y="410" width="40" height="70" rx="8"/><circle cx="1000" cy="400" r="22"/></g>
  </g>

  <g id="actors"></g>

  <g id="fx">
    <g id="stars" display="none"></g>
    <g id="bonk" display="none">
      <polygon points="0,-150 40,-60 140,-100 80,-20 170,40 60,50 70,160 0,80 -70,160 -60,50 -170,40 -80,-20 -140,-100 -40,-60" fill="#FFE066" stroke="#E4572E" stroke-width="10"/>
      <text class="pop" text-anchor="middle" y="30" font-size="88" fill="#E4572E">BONK!</text>
    </g>
    <text id="sub" class="pop" x="540" y="520" text-anchor="middle" font-size="64" fill="#fff" stroke="#1B1B22" stroke-width="12" paint-order="stroke" stroke-linejoin="round"></text>
    <g id="nam" display="none">
      <text class="pop" text-anchor="middle" font-size="120" fill="#fff" stroke="#E4572E" stroke-width="14" paint-order="stroke">NAM!</text>
    </g>
  </g>
</svg>

<script>window.PUHE = [];</script>
<script src="puhe.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const set = (id, attrs) => { const el = $(id); for (const k in attrs) el.setAttribute(k, attrs[k]); };
const tf = (id, v) => $(id).setAttribute('transform', v);
const show = (id, on) => $(id).setAttribute('display', on ? 'inline' : 'none');
const wrap = (x, w) => ((x % w) + w) % w;

// ---- Hahmot ----------------------------------------------------------
// Kissa seisoo kahdella jalalla. Origo jalkojen välissä maan tasossa.
// Käsivarren kiertokulma: 0 = roikkuu alas, -90 = osoittaa oikealle, -180 = ylös.
const ORANGE = '#F29B4B', DARK = '#E07E2E', CREAM = '#FFF1DF';

function armSVG(id, props = '') {
  return `<g id="${id}"><rect x="-32" y="0" width="64" height="150" rx="32" fill="${DARK}"/>${props}<circle cy="150" r="38" fill="${ORANGE}"/><path d="M-18,168 v12 M0,172 v12 M18,168 v12" stroke="${DARK}" stroke-width="5" stroke-linecap="round"/></g>`;
}
const STICK = id => `<g id="${id}"><rect x="-12" y="-190" width="24" height="540" rx="12" fill="#6E4A2C"/><g fill="#9A7A52"><rect x="-14" y="-170" width="28" height="10"/><rect x="-14" y="-150" width="28" height="10"/><rect x="-14" y="-130" width="28" height="10"/></g></g>`;
const DRUMSTICK = id => `<g id="${id}"><rect x="-10" y="120" width="20" height="70" rx="8" fill="#F5EBDD"/><circle cx="-12" cy="118" r="13" fill="#F5EBDD"/><circle cx="12" cy="118" r="13" fill="#F5EBDD"/><ellipse cy="232" rx="48" ry="58" fill="#C8752E"/><ellipse cx="-14" cy="220" rx="20" ry="30" fill="#E3964A"/><circle id="${id}-bite" cx="36" cy="270" r="0" fill="#E3C9A8"/></g>`;

function catSVG(p, { stick = false } = {}) {
  const chain = [];
  for (let i = 0; i <= 10; i++) {
    const a = (18 + i * 14.4) * Math.PI / 180;
    const x = 118 * Math.cos(a), y = -372 + 92 * Math.sin(a);
    chain.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="15" ry="10" transform="rotate(${(a * 180 / Math.PI - 90 + (i % 2) * 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="none" stroke="#C9CDD6" stroke-width="7"/>`);
  }
  const foot = (n, x) => `<g id="${p}-f${n}" transform="translate(${x},0)"><ellipse cy="-40" rx="62" ry="46" fill="${DARK}"/><ellipse cy="-18" rx="50" ry="22" fill="${ORANGE}"/></g>`;
  return `<g id="${p}">
    <path id="${p}-tail" d="M-120,-110 C-260,-120 -280,-260 -230,-330" stroke="${DARK}" stroke-width="44" fill="none" stroke-linecap="round"/>
    <g id="${p}-legs">${foot(1, -75)}${foot(2, 75)}</g>
    <ellipse cy="-235" rx="178" ry="210" fill="url(#fur)"/>
    <ellipse cy="-200" rx="126" ry="158" fill="${CREAM}"/>
    <path d="M-170,-300 q30,10 40,40 M-176,-240 q30,10 40,40 M170,-300 q-30,10 -40,40 M176,-240 q-30,10 -40,40" stroke="${DARK}" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g id="${p}-chain">${chain.join('')}<circle cy="-262" r="22" fill="none" stroke="#DDE0E6" stroke-width="10"/></g>
    <g id="${p}-head" transform="translate(0,-475)">
      <polygon points="-130,-40 -120,-175 -40,-105" fill="${ORANGE}"/><polygon points="-112,-60 -108,-148 -60,-105" fill="#FFB5A7"/>
      <polygon points="130,-40 120,-175 40,-105" fill="${ORANGE}"/><polygon points="112,-60 108,-148 60,-105" fill="#FFB5A7"/>
      <ellipse rx="155" ry="128" fill="url(#fur)"/>
      <path d="M-20,-120 q20,30 0,55 M20,-120 q-20,30 0,55" stroke="${DARK}" stroke-width="10" fill="none" stroke-linecap="round"/>
      <ellipse cy="48" rx="72" ry="48" fill="${CREAM}"/>
      <g id="${p}-eyes">
        <ellipse cx="-55" cy="-12" rx="34" ry="36" fill="#fff"/><ellipse cx="55" cy="-12" rx="34" ry="36" fill="#fff"/>
        <g id="${p}-pupils"><circle cx="-55" cy="-10" r="19" fill="#2B2B35"/><circle cx="55" cy="-10" r="19" fill="#2B2B35"/><circle cx="-49" cy="-17" r="6" fill="#fff"/><circle cx="61" cy="-17" r="6" fill="#fff"/></g>
      </g>
      <g id="${p}-happy" display="none" stroke="#2B2B35" stroke-width="9" fill="none" stroke-linecap="round"><path d="M-82,-8 q27,-30 54,0 M28,-8 q27,-30 54,0"/></g>
      <polygon points="-15,22 15,22 0,38" fill="#F08C9A"/>
      <g id="${p}-smile"><path d="M0,38 q-18,22 -38,10 M0,38 q18,22 38,10" stroke="#2B2B35" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <g id="${p}-grin" display="none"><path d="M-48,44 Q0,120 48,44 Z" fill="#7A2E35"/><ellipse cy="84" rx="22" ry="12" fill="#F08C9A"/><polygon points="-38,46 -28,46 -33,64" fill="#fff"/><polygon points="38,46 28,46 33,64" fill="#fff"/></g>
      <path d="M-70,40 l-100,-14 M-70,56 l-100,12 M70,40 l100,-14 M70,56 l100,12" stroke="#FFF7EC" stroke-width="4" stroke-linecap="round"/>
      <g id="${p}-shades" display="none"><rect x="-108" y="-46" width="96" height="62" rx="20" fill="#1E3A6E"/><rect x="12" y="-46" width="96" height="62" rx="20" fill="#1E3A6E"/><rect x="-14" y="-32" width="28" height="10" fill="#15151C"/><path d="M-108,-30 h-40 M108,-30 h40" stroke="#15151C" stroke-width="8"/><rect x="-94" y="-38" width="30" height="10" rx="5" fill="#fff" opacity="0.45"/><rect x="26" y="-38" width="30" height="10" rx="5" fill="#fff" opacity="0.45"/></g>
      <g id="${p}-hat" display="none" transform="translate(0,-112)"><rect x="-105" y="-40" width="210" height="62" rx="10" fill="#fff" stroke="#DDD" stroke-width="4"/><path d="M-80,-10 h160" stroke="#4E9A5A" stroke-width="10" stroke-dasharray="18 10"/><circle cy="-8" r="16" fill="#E8B43A"/><circle cx="-70" cy="-85" r="62" fill="#fff"/><circle cx="70" cy="-85" r="62" fill="#fff"/><circle cy="-120" r="75" fill="#fff"/></g>
    </g>
    <g id="${p}-armLw" transform="translate(-150,-335)">${armSVG(p + '-armL')}</g>
    <g id="${p}-armRw" transform="translate(150,-335)">${armSVG(p + '-armR', stick ? STICK(p + '-stick') : '')}</g>
  </g>`;
}

// Valkoinen ankka katsoo oikealle. Origo jalkojen välissä.
function duckSVG(p) {
  const leg = (n, x) => `<g id="${p}-l${n}" transform="translate(${x},-55)"><rect x="-7" y="0" width="14" height="55" fill="#F08A24"/><path d="M-10,52 L40,52 L30,62 L-10,62 Z" fill="#F08A24"/></g>`;
  return `<g id="${p}">
    ${leg(1, -30)}${leg(2, 15)}
    <path d="M-95,-110 l-50,-30 l15,60 z" fill="#F4F4F8"/>
    <ellipse cx="-10" cy="-100" rx="98" ry="68" fill="#FFFFFF" stroke="#E2E2EA" stroke-width="4"/>
    <ellipse cx="30" cy="-160" rx="38" ry="60" fill="#FFFFFF"/>
    <ellipse cx="-30" cy="-100" rx="58" ry="36" fill="#EFEFF5"/>
    <g id="${p}-head" transform="translate(45,-210)">
      <circle r="58" fill="#FFFFFF" stroke="#E2E2EA" stroke-width="4"/>
      <path d="M40,0 Q95,-6 108,12 Q80,34 40,22 Z" fill="#F29A38"/>
      <path d="M45,14 Q80,20 104,14" stroke="#C8741E" stroke-width="4" fill="none"/>
      <g id="${p}-eye"><circle cx="18" cy="-14" r="12" fill="#2B2B35"/><circle cx="22" cy="-18" r="4" fill="#fff"/></g>
      <ellipse id="${p}-mouth" display="none" cx="72" cy="17" rx="30" ry="9" fill="#7A2E35"/>
      <g id="${p}-x" display="none" stroke="#2B2B35" stroke-width="6" stroke-linecap="round"><path d="M6,-26 l22,22 M28,-26 l-22,22"/></g>
    </g>
  </g>`;
}

function bikeSVG() {
  const wheel = (id, x) => `<g transform="translate(${x},0)"><circle r="95" fill="#22242B"/><circle r="60" fill="#D5D9E0"/><g id="${id}" stroke="#8A909C" stroke-width="6"><path d="M-60,0 H60 M0,-60 V60 M-42,-42 L42,42 M-42,42 L42,-42"/></g><circle r="16" fill="#555"/></g>`;
  let grid = '';
  for (let x = 250; x <= 410; x += 32) grid += `M${x},-300 V-180 `;
  for (let y = -270; y <= -180; y += 30) grid += `M232,${y} H418 `;
  return {
    back: `<g id="bike">
      ${wheel('w1', -270)}${wheel('w2', 290)}
      <path d="M-270,0 L-120,-150 M290,0 L180,-260" stroke="#9AA0AA" stroke-width="22" stroke-linecap="round"/>
      <path d="M-360,-120 Q-360,-230 -220,-230 L60,-230 Q170,-230 200,-150 L150,-90 L-330,-90 Q-360,-90 -360,-120 Z" fill="#3E9CC4"/>
      <rect x="-60" y="-110" width="160" height="80" rx="16" fill="#8A909C"/>
      <path d="M-40,-70 h120 M-40,-50 h120" stroke="#5E646E" stroke-width="8"/>
      <path d="M-330,-60 L-140,-40" stroke="#C9CDD6" stroke-width="18" stroke-linecap="round"/>
      <rect x="-300" y="-270" width="310" height="52" rx="26" fill="#2B2B35"/>
      <ellipse cx="80" cy="-228" rx="90" ry="40" fill="#52B2DA"/>
    </g>`,
    front: `<g>
      <path d="M170,-240 L150,-450" stroke="#9AA0AA" stroke-width="20" stroke-linecap="round"/>
      <path d="M100,-458 L200,-448" stroke="#22242B" stroke-width="24" stroke-linecap="round"/>
      <path d="M190,-450 l40,-70" stroke="#9AA0AA" stroke-width="8"/><circle cx="235" cy="-530" r="22" fill="#D5D9E0" stroke="#9AA0AA" stroke-width="6"/>
      <rect x="232" y="-300" width="186" height="120" rx="8" fill="rgba(210,214,222,0.35)" stroke="#B8BCC4" stroke-width="8"/>
      <path d="${grid}" stroke="#B8BCC4" stroke-width="5"/>
      <circle cx="440" cy="-230" r="36" fill="#FFF3B0" stroke="#9AA0AA" stroke-width="10"/>
    </g>`
  };
}

function panSVG(p) {
  let bubbles = '';
  for (let i = 0; i < 7; i++) bubbles += `<circle id="${p}-b${i}" r="8" fill="#FFF3B0" opacity="0.8"/>`;
  return {
    back: `<g id="${p}-back"><ellipse rx="190" ry="48" fill="#50555F"/><ellipse cy="6" rx="165" ry="36" fill="#E8B84A"/><rect x="-40" y="-8" width="60" height="30" rx="6" fill="#FFE27A" transform="rotate(-8)"/>${bubbles}</g>`,
    front: `<g id="${p}-front"><path d="M-190,0 Q-180,70 0,74 Q180,70 190,0 Q180,40 0,44 Q-180,40 -190,0 Z" fill="#6E747F"/><path d="M180,20 L400,70" stroke="#2B2B35" stroke-width="30" stroke-linecap="round"/></g>`
  };
}

function build() {
  const bike = bikeSVG(), pan = panSVG('pan');
  let stars = '';
  for (let i = 0; i < 5; i++) stars += `<use id="s${i}" href="#star" fill="#FFD23F" stroke="#E4A000" stroke-width="4"/>`;
  $('stars').innerHTML = stars;
  let feathers = '';
  for (let i = 0; i < 4; i++) feathers += `<use id="fe${i}" href="#feather" fill="#fff" stroke="#DADAE2" stroke-width="3"/>`;
  $('actors').innerHTML = `
    <g id="walk">${catSVG('c1', { stick: true })}${duckSVG('d1')}</g>
    <g id="ride">${duckSVG('d3')}${bike.back}${catSVG('c3')}${bike.front}</g>
    <g id="cook">
      ${catSVG('c4')}
      <rect x="0" y="1470" width="1080" height="450" fill="#9A6538"/>
      <rect x="0" y="1440" width="1080" height="44" fill="#E6E1D8"/>
      <g fill="#86552E"><rect x="40" y="1540" width="300" height="340" rx="14"/><rect x="390" y="1540" width="300" height="340" rx="14"/><rect x="740" y="1540" width="300" height="340" rx="14"/></g>
      <rect x="650" y="1428" width="440" height="36" rx="10" fill="#2F333C"/>
      <g id="flames">${[0,1,2,3,4].map(i => `<path id="fl${i}" fill="#3DA5FF"/>`).join('')}</g>
      <g transform="translate(870,1410)">${pan.back}</g>
      <g id="k-armw">${armSVG('k-arm', DRUMSTICK('drum'))}</g>
      <g transform="translate(870,1410)">${pan.front}</g>
      <g id="steam" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8">${[0,1,2].map(i => `<path id="sm${i}"/>`).join('')}</g>
      ${feathers}
    </g>`;
  let b = '';
  for (let i = 0; i < 6; i++) b += `<g id="bu${i}"><circle r="110" fill="#5FAE52"/><circle cx="-80" cy="30" r="80" fill="#6BBE5C"/><circle cx="80" cy="25" r="85" fill="#58A64C"/></g>`;
  $('bushes').innerHTML = b;
  let st = '';
  for (let i = 0; i < 6; i++) st += `<rect id="st${i}" y="1540" width="160" height="24" rx="12"/>`;
  $('stripes').innerHTML = st;
  let sp = '';
  for (let i = 0; i < 7; i++) sp += `<path id="sp${i}"/>`;
  $('speed').innerHTML = sp;
}

// ---- Apufunktiot -----------------------------------------------------
// window.PUHE tulee aani.py:n kirjoittamasta puhe.js:stä: kuka puhuu ja milloin.
const talking = (who, t) => window.PUHE.some(l => l.who === who && t >= l.start && t < l.start + l.dur);
const flap = t => Math.floor(t * 9) % 3 !== 2;
const catMouth = (t, dflt) => talking('kissa', t) ? (flap(t) ? 'grin' : 'smile') : dflt;

function catFace(p, { eyes = 'open', mouth = 'smile', look = 0, shades = false, hat = false } = {}) {
  show(`${p}-eyes`, eyes === 'open'); show(`${p}-happy`, eyes === 'happy');
  show(`${p}-smile`, mouth === 'smile'); show(`${p}-grin`, mouth === 'grin');
  show(`${p}-shades`, shades); show(`${p}-hat`, hat);
  tf(`${p}-pupils`, `translate(${look * 13},${Math.abs(look) * 4})`);
}
function catWalk(p, t, amp) {
  const s = Math.sin(t * Math.PI * 4);
  tf(`${p}-f1`, `translate(-75,${-Math.max(0, s) * amp})`);
  tf(`${p}-f2`, `translate(75,${-Math.max(0, -s) * amp})`);
}
function tailWag(p, t) {
  const w = Math.sin(t * 5) * 30;
  set(`${p}-tail`, { d: `M-120,-110 C-260,-120 ${-280 + w},-260 ${-230 + w * 1.4},-330` });
}
const arm = (p, side, a) => tf(`${p}-arm${side}`, `rotate(${a})`);
function duckWalk(p, t) {
  const s = Math.sin(t * Math.PI * 5);
  tf(`${p}-l1`, `translate(-30,${-55 - Math.max(0, s) * 18})`);
  tf(`${p}-l2`, `translate(15,${-55 - Math.max(0, -s) * 18})`);
}
function duckKO(p, ko, t = -1) { show(`${p}-eye`, !ko); show(`${p}-x`, ko); show(`${p}-mouth`, talking('ankka', t) && flap(t)); }
function starsAt(x, y, u, r) {
  for (let i = 0; i < 5; i++) {
    const a = u * 4 + i * Math.PI * 2 / 5;
    tf(`s${i}`, `translate(${x + Math.cos(a) * 110 * r},${y + Math.sin(a) * 32 * r}) rotate(${u * 200}) scale(${.55 + .2 * Math.sin(a)})`);
  }
}

// ---- Kohtaukset -------------------------------------------------------
const CAT_S = 1.3, GROUND = 1640;

function sceneWalk(t) { // 0–3 s: kissa ja ankka kävelevät niityllä
  const x = lerp(250, 330, t / 3);
  const bob = Math.abs(Math.sin(t * Math.PI * 4)) * 10;
  tf('c1', `translate(${x},${GROUND - bob}) scale(${CAT_S})`);
  catWalk('c1', t, 22); tailWag('c1', t);
  catFace('c1', { look: t > 1.8 ? easeOut(seg(t, 1.8, 2.3)) : 0, mouth: catMouth(t, 'smile') });
  tf('c1-head', `translate(0,${-475 + Math.sin(t * Math.PI * 4) * 4}) rotate(${t > 1.8 ? 6 * seg(t, 1.8, 2.3) : 0})`);
  arm('c1', 'L', Math.sin(t * Math.PI * 4) * 14);
  arm('c1', 'R', -6 + Math.sin(t * Math.PI * 4) * 3);
  tf('c1-armRw', 'translate(150,-335)');
  const dx = x + 520;
  tf('d1', `translate(${dx},${GROUND - Math.abs(Math.sin(t * Math.PI * 5)) * 10}) scale(1.05)`);
  duckWalk('d1', t); duckKO('d1', false, t);
  tf('d1-head', `translate(45,${-210 + Math.sin(t * 16) * 5})`);
}

function sceneBonk(t) { // 3–5,5 s: kissa lyö ankkaa kepillä
  const u = t - 3;
  const x = 330;
  tf('c1', `translate(${x},${GROUND}) scale(${CAT_S})`);
  catWalk('c1', 0, 0); tailWag('c1', u * 2);
  // Nosto taakse, sitten isku alas ankan päähän
  const raise = easeInOut(seg(u, .15, .7)), hit = easeIn(seg(u, .85, 1.0));
  const a = u < .85 ? lerp(-6, -205, raise) : lerp(-205, -62, hit) + 40 * easeInOut(seg(u, 1.5, 2.1));
  arm('c1', 'R', a + (u > 1 ? Math.sin((u - 1) * 30) * 4 * (1 - seg(u, 1, 1.5)) : 0));
  arm('c1', 'L', lerp(0, -30, raise) * (1 - seg(u, 1.1, 1.6)));
  const impact = u >= 1.0;
  catFace('c1', { look: 1, eyes: u > 1.4 ? 'happy' : 'open', mouth: catMouth(t, u > 1.4 ? 'grin' : 'smile') });
  tf('c1-head', `translate(0,-475) rotate(${impact ? 4 : 6})`);

  // Ankka: litistyy, kaatuu selälleen, tähdet pään ympärillä
  const dx = x + 520;
  const sq = impact ? 1 - .25 * Math.sin(seg(u, 1.0, 1.25) * Math.PI) : 1;
  const fall = easeOut(seg(u, 1.25, 1.65));
  const bounce = fall >= 1 ? Math.abs(Math.sin(seg(u, 1.65, 1.95) * Math.PI)) * 20 * (1 - seg(u, 1.65, 1.95)) : 0;
  tf('d1', `translate(${dx + fall * 40},${GROUND - fall * 75 - bounce}) rotate(${-95 * fall}) scale(${1.05 / Math.sqrt(sq)},${1.05 * sq})`);
  duckWalk('d1', 0); duckKO('d1', impact, t);
  tf('d1-head', `translate(45,-210) rotate(${impact ? 15 : 0})`);
  show('stars', u > 1.1);
  // Pää on kaatumisen jälkeen vasemmalla, maan tasossa
  const hx = lerp(dx + 50, dx + 40 - 210 * 1.05, fall), hy = lerp(GROUND - 290, GROUND - 130, fall);
  starsAt(hx, hy - 60, u, seg(u, 1.1, 1.4));
  const b = seg(u, 1.0, 1.15), bOut = seg(u, 1.7, 2.0);
  show('bonk', u > 1.0 && u < 2.0);
  tf('bonk', `translate(${dx + 20},${GROUND - 560}) scale(${easeOut(b) * 1.15 * (1 - bOut)}) rotate(${-8 + Math.sin(u * 20) * 3})`);
}

function sceneRide(t) { // 5,5–8,5 s: moottoripyörällä kotiin, ankka korissa
  const u = t - 5.5;
  const off = u * 1000;
  for (let i = 0; i < 6; i++) tf(`bu${i}`, `translate(${wrap(i * 300 - off * .5, 1800) - 300},${1250 + (i % 2) * 40})`);
  for (let i = 0; i < 6; i++) set(`st${i}`, { x: wrap(i * 300 - off, 1800) - 300 });
  for (let i = 0; i < 7; i++) {
    const y = 700 + i * 110 + (i % 2) * 30, x = wrap(i * 410 - off * 1.6, 1400) - 160;
    set(`sp${i}`, { d: `M${x},${y} h${120 + (i % 3) * 60}` });
  }
  const mx = lerp(-400, 470, easeOut(seg(u, 0, .7)));
  const jump = u > 1.6 && u < 2.1 ? Math.sin(seg(u, 1.6, 2.1) * Math.PI) : 0;
  const bump = Math.sin(u * 22) * 5 - jump * 70;
  tf('ride', `translate(${mx},${1545 + bump}) rotate(${-jump * 6 + Math.sin(u * 3)}) scale(1.05)`);
  tf('w1', `rotate(${u * 900})`); tf('w2', `rotate(${u * 900})`);
  // Kissa satulassa
  tf('c3', `translate(-120,${-240 + 22 + Math.sin(u * 22 + .5) * 4}) scale(0.9)`);
  show('c3-legs', false);
  catFace('c3', { shades: true, mouth: catMouth(t, 'grin') });
  tailWag('c3', u * 2);
  arm('c3', 'R', -62); arm('c3', 'L', -55);
  tf('c3-head', `translate(0,${-475 + Math.sin(u * 22) * 5}) rotate(${Math.sin(u * 4) * 3})`);
  // Ankka korissa tajuttomana, pää heiluu
  tf('d3', 'translate(300,-200) scale(0.72)');
  duckKO('d3', true);
  tf('d3-head', `translate(45,-210) rotate(${25 + Math.sin(u * 11) * 18 + jump * 40})`);
}

function sceneCook(t) { // 8,5–12 s: kokkaus ja haukkaus
  const u = t - 8.5;
  const CX = 400, CY = 1760, S = 1.55;
  tf('c4', `translate(${CX},${CY}) scale(${S})`);
  show('c4-legs', false); show('c4-armR', false);
  tailWag('c4', u);
  const lift = easeInOut(seg(u, 2.0, 2.6));
  const chew = u > 2.7 ? Math.abs(Math.sin((u - 2.7) * 14)) : 0;
  catFace('c4', { hat: true, eyes: u < 2.0 || u > 2.7 ? 'happy' : 'open', mouth: catMouth(t, u > 2.6 && chew < .5 ? 'smile' : 'grin') });
  tf('c4-head', `translate(0,${-475 + Math.sin(u * 5) * 5 + chew * 6}) rotate(${Math.sin(u * 3) * 3 - lift * 6})`);
  arm('c4', 'L', 18 + Math.sin(u * 5) * 6);
  // Oikea käsi koipineen piirretään pannun päälle omana kappaleenaan
  const dunk = Math.sin(u * 9) * 7;
  const a = lerp(-71 + dunk * .6, -238, lift);
  tf('k-armw', `translate(${CX + 150 * S},${CY - 335 * S}) scale(${S}) rotate(${a})`);
  set('drum-bite', { r: u > 2.75 ? 26 : 0 });
  for (let i = 0; i < 7; i++) {
    const ph = wrap(u * 1.7 + i * .37, 1);
    set(`pan-b${i}`, { cx: -130 + i * 42, cy: 6 + Math.sin(i * 2.1) * 14, r: 3 + ph * 9, opacity: .9 * (1 - ph) });
  }
  for (let i = 0; i < 5; i++) {
    const h = 26 + Math.sin(u * 25 + i * 1.3) * 8, x = 740 + i * 65;
    set(`fl${i}`, { d: `M${x - 18},1430 Q${x},${1430 - h * 2} ${x + 18},1430 Z` });
  }
  for (let i = 0; i < 3; i++) {
    const ph = wrap(u * .8 + i / 3, 1);
    const x = 800 + i * 70, y = 1330 - ph * 280;
    set(`sm${i}`, { d: `M${x},${y} q25,-40 0,-80 q-25,-40 0,-80`, opacity: Math.sin(ph * Math.PI) });
  }
  // Muutama sulka leijailee vielä ilmassa
  for (let i = 0; i < 4; i++) {
    const y = wrap(250 + i * 380 + u * 120, 1500) + 100;
    tf(`fe${i}`, `translate(${[160, 900, 560, 980][i] + Math.sin(u * 2 + i) * 40},${y}) rotate(${Math.sin(u * 2.5 + i) * 35}) scale(.8)`);
  }
  const n = seg(u, 2.8, 2.95);
  tf('nam', `translate(760,720) scale(${easeOut(n) * (1 - seg(u, 3.4, 3.6)) * (1 + Math.sin(u * 12) * .04)}) rotate(8)`);
}

window.render = function (t) {
  const s = t < 3 ? 0 : t < 5.5 ? 1 : t < 8.5 ? 2 : 3;
  show('park', s <= 1); show('road', s === 2); show('kitchen', s === 3);
  show('walk', s <= 1); show('ride', s === 2); show('cook', s === 3);
  show('bonk', false); show('stars', false); show('nam', false);
  tf('cloud1', `translate(${180 + t * 20},330)`);
  tf('cloud2', `translate(${720 + t * 12},560)`);
  tf('cloud3', `translate(${520 - t * 10},180)`);
  [sceneWalk, sceneBonk, sceneRide, sceneCook][s](t);
  show('nam', t > 11.3 && t < 12.1);
  // Tekstitys: repliikki näkyy puheen ajan ja hetken sen jälkeen
  const line = window.PUHE.filter(l => t >= l.start && t < l.start + l.dur + .25).pop();
  $('sub').textContent = line ? line.text : '';
  $('sub').setAttribute('fill', line && line.who === 'ankka' ? '#FFE27A' : '#fff');
};
window.DURATION = 13;

build();
window.render(0);
</script>
